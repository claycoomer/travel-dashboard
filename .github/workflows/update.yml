name: Update Travel Data

on:
  schedule:
    - cron: '0 12 * * *'   # Daily at 8 AM ET (noon UTC)
  workflow_dispatch:         # Also allows manual trigger anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch travel data
        env:
          FAA_API_KEY: ${{ secrets.FAA_API_KEY }}
        run: python fetch_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet && echo "No data changes" || \
            git commit -m "Auto-update travel data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
